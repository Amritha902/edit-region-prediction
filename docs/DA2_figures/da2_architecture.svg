<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#2B2B2B"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#1B7A4B"/></marker>
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill:#1B1A17; }
    .lbl  { font-size:11px; letter-spacing:1.2px; fill:#7A7770; font-family:Helvetica,Arial,sans-serif; }
    .h    { font-size:15px; font-weight:bold; }
    .s    { font-size:12px; fill:#4A4842; }
    .m    { font-size:11.5px; fill:#6A6862; font-style:italic; }
    .eq   { font-size:13px; font-family:'DejaVu Sans Mono',Consolas,monospace; }
    .box  { fill:#FFFFFF; stroke:#2B2B2B; stroke-width:1.3; }
    .froz { fill:#F1F0ED; stroke:#A8A59E; stroke-width:1.3; }
    .new  { fill:#F2F9F4; stroke:#1B7A4B; stroke-width:1.6; }
    .ln   { stroke:#2B2B2B; stroke-width:1.3; fill:none; }
    .lng  { stroke:#1B7A4B; stroke-width:1.3; fill:none; }
  </style>
</defs>

<text class="lbl" x="40" y="38">INPUT</text>
<rect class="box" x="40"  y="50" width="230" height="52" rx="4"/>
<text class="h" x="54" y="72">Source image</text><text class="s" x="54" y="91">640 × 640 RGB</text>
<rect class="box" x="300" y="50" width="250" height="52" rx="4"/>
<text class="h" x="314" y="72">Instruction</text><text class="s" x="314" y="91">“put a hat on the dog”</text>

<text class="lbl" x="780" y="38">SUPERVISION</text>
<rect class="box" x="780" y="50" width="360" height="52" rx="4"/>
<text class="h" x="794" y="72">MagicBrush source → target pair</text>
<text class="s" x="794" y="91">real human edit, 8,306 usable training turns</text>

<path class="ln"  d="M155,102 L155,140" marker-end="url(#a)"/>
<path class="ln"  d="M425,102 L425,140" marker-end="url(#a)"/>
<path class="lng" d="M960,102 L960,140" marker-end="url(#ag)"/>

<text class="lbl" x="40" y="132">FROZEN ENCODERS</text>
<rect class="froz" x="40"  y="142" width="230" height="66" rx="4"/>
<text class="h" x="54" y="165">FastSAM · YOLOv8x-seg</text>
<text class="s" x="54" y="183">71,751,811 parameters · frozen</text>
<text class="m" x="54" y="200">run once per image</text>
<rect class="froz" x="300" y="142" width="250" height="66" rx="4"/>
<text class="h" x="314" y="165">CLIP text encoder</text>
<text class="s" x="314" y="183">ViT-B/32 · 512-d · frozen</text>
<text class="m" x="314" y="200">run once per instruction</text>

<rect class="new" x="780" y="142" width="360" height="82" rx="4"/>
<text class="lbl" x="794" y="161" style="fill:#1B7A4B">TARGET DERIVATION</text>
<text class="h" x="794" y="182" style="fill:#1B7A4B">CIE76 ΔE in L*a*b*</text>
<text class="s" x="794" y="200">threshold 12 · open/close 5 × 5 · drop components &lt; 40 px</text>
<text class="s" x="794" y="216">keep samples whose changed area is 0.4 %–45 %</text>

<path class="ln" d="M120,208 L120,246" marker-end="url(#a)"/>
<path class="ln" d="M220,208 L220,246" marker-end="url(#a)"/>
<path class="ln" d="M425,208 L425,246" marker-end="url(#a)"/>

<text class="lbl" x="40" y="240">FROZEN FEATURES</text>
<rect class="froz" x="40"  y="248" width="150" height="58" rx="4"/>
<text class="h" x="54" y="270">32 prototypes</text><text class="s" x="54" y="289">160 × 160, stride 4</text>
<rect class="froz" x="200" y="248" width="120" height="58" rx="4"/>
<text class="h" x="214" y="270">image context</text><text class="s" x="214" y="289">SPPF pooled, 640-d</text>
<rect class="froz" x="330" y="248" width="130" height="58" rx="4"/>
<text class="h" x="344" y="270">text embedding</text><text class="s" x="344" y="289">512-d</text>

<path class="ln" d="M260,306 L260,344" marker-end="url(#a)"/>
<path class="ln" d="M395,306 L395,344" marker-end="url(#a)"/>

<text class="lbl" x="200" y="338">TRAINABLE · 4,693,633 PARAMETERS</text>
<rect class="box" x="200" y="346" width="260" height="60" rx="4"/>
<text class="h" x="214" y="368">FiLM fusion</text>
<text class="eq" x="214" y="390">v = γ(t) ⊙ v + β(t)</text>

<path class="ln" d="M330,406 L330,438" marker-end="url(#a)"/>
<path class="ln" d="M200,420 L120,420 L120,438" marker-end="url(#a)"/>
<path class="ln" d="M460,420 L540,420 L540,438" marker-end="url(#a)"/>

<rect class="box" x="40"  y="440" width="180" height="70" rx="4"/>
<text class="h" x="54" y="462">global branch</text>
<text class="s" x="54" y="480">one 32-vector + bias</text>
<text class="m" x="54" y="498">an overall prior for the frame</text>

<rect class="new" x="250" y="440" width="180" height="70" rx="4"/>
<text class="h" x="264" y="462" style="fill:#1B7A4B">spatial branch</text>
<text class="s" x="264" y="480">20 × 20 coefficient field</text>
<text class="m" x="264" y="498">bilinear upsample to 160 × 160</text>

<rect class="froz" x="460" y="440" width="160" height="70" rx="4"/>
<text class="h" x="474" y="462">prototypes</text>
<text class="s" x="474" y="480">the spatial basis</text>
<text class="m" x="474" y="498">no parameters of its own</text>

<path class="ln" d="M130,510 L130,540 L330,540 L330,566" marker-end="url(#a)"/>
<path class="ln" d="M340,510 L340,540" />
<path class="ln" d="M540,510 L540,540 L340,540" />

<rect class="new" x="180" y="568" width="440" height="72" rx="4"/>
<text class="lbl" x="194" y="588" style="fill:#1B7A4B">MASK CONSTRUCTION</text>
<text class="eq" x="194" y="612" style="fill:#1B7A4B">mask = σ( Σᵢ cᵢ(x,y) · protoᵢ(x,y) + b )</text>
<text class="s" x="194" y="632">coefficients come from the instruction, not from a detection</text>

<path class="ln" d="M620,604 L740,604" marker-end="url(#a)"/>
<rect class="box" x="744" y="574" width="180" height="60" rx="4"/>
<text class="h" x="758" y="596">Predicted region</text>
<text class="s" x="758" y="615">160 × 160 · threshold 0.5</text>

<path class="ln"  d="M924,604 L1000,604" marker-end="url(#a)"/>
<path class="lng" d="M960,224 L960,574" marker-end="url(#ag)"/>
<rect class="box" x="1004" y="574" width="136" height="60" rx="4"/>
<text class="h" x="1018" y="596">Loss</text>
<text class="eq" x="1018" y="618">BCE + 2·Dice</text>

<line x1="40" y1="666" x2="1140" y2="666" stroke="#D8D5CE" stroke-width="1"/>
<text class="m" x="40" y="686">Neither encoder trains. The per-image stage is paid once; the per-instruction stage costs 5.30 ms.</text>
</svg>
