<path class="ln" d="M966 262 L 966 280"/>

<rect class="tren" x="746" y="370" width="290" height="60" rx="3"/>
<text class="b" x="758" y="391">TextCoeffHead</text>
<text class="s" x="758" y="408">FiLM: v = γ(t)·v + β(t)  →  32 coefficients</text>
<text class="s" x="758" y="424">1.4 M  ·  BCE + 2·Dice</text>
<path class="ln" d="M900 336 L 890 364"/>

