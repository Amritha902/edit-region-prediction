<!-- ================= RIGHT : Ours ================= -->
<text class="h" x="746" y="108">OURS  ·  text-conditioned prototype coefficients</text>

<rect class="box" x="746" y="126" width="290" height="44" rx="3"/>
<text class="b" x="758" y="146">image  +  instruction</text><text class="s" x="758" y="163">"put a hat on the dog"</text>

