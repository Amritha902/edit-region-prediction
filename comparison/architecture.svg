<rect x="746" y="606" width="290" height="96" rx="3" fill="#f7f7f7" stroke="#111" stroke-width="1.2"/>
<text class="h" x="760" y="628" style="font-size:11px">TOTALS</text>
<text class="b" x="760" y="650">trainable   1.4 M   (1.9% of backbone)</text>
<text class="b" x="760" y="670">frozen      71.75 M</text>
<text class="s" x="760" y="690">supervision: ΔE-derived from real pairs</text>

<!-- ================= WHAT IS NEW ================= -->
<line x1="40" y1="730" x2="1380" y2="730" stroke="#111" stroke-width="1.2"/>
<text class="h" x="40" y="756">WHAT IS NEW</text>
<text class="b" x="40" y="782">1.  Where the mask comes from.</text>
<text class="s" x="270" y="782">They decode it from a learned 16×16 query grid. We express it as a text-weighted</text>
<text class="s" x="270" y="798">combination of the segmenter's own prototypes — no new spatial decoder is learned.</text>
<text class="b" x="40" y="824">2.  The supervision.</text>
<text class="s" x="270" y="824">They train on MagicBrush human masks. We measured those at 9.1× too large (precision 15.8%, IoU 0.16);</text>
<text class="s" x="270" y="840">ours are derived by ΔE from the same real pairs, and reach IoU 0.1632 — above the masks they train on.</text>
<text class="b" x="40" y="866">3.  The scale.</text>
<text class="s" x="270" y="866">5.0 B trainable on multi-GPU  →  1.4 M trainable on a MacBook Air.  3,570× fewer trained parameters.</text>
