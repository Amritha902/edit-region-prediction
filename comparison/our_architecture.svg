<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#2B2B2B"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#1B7A4B"/></marker>
  <style>
    text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1A1A1A}
    .title{font-size:22px;font-weight:600;letter-spacing:-0.2px}
    .sub{font-size:12.5px;fill:#6B6B6B}
    .sect{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:#8A8A8A}
    .name{font-size:13.5px;font-weight:600}
    .meta{font-size:10.5px;fill:#6B6B6B}
    .eq{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
    .tag{font-size:9px;font-weight:700;letter-spacing:1px}
    .keep{fill:#FFFFFF;stroke:#2B2B2B;stroke-width:1.3}
    .froz{fill:#F4F4F4;stroke:#9A9A9A;stroke-width:1.3}
    .new {fill:#EFF8F2;stroke:#1B7A4B;stroke-width:2.2}
    .lim {fill:#FDF0EF;stroke:#A33A2C;stroke-width:2.2}
    .ln{stroke:#2B2B2B;stroke-width:1.3;fill:none;marker-end:url(#ar)}
    .lng{stroke:#1B7A4B;stroke-width:1.6;fill:none;marker-end:url(#arg)}
  </style>
</defs>

<text class="title" x="56" y="52">Our architecture, and where it breaks</text>
<text class="sub" x="56" y="74">Same skeleton as AdaptEdit (arXiv:2604.23763).  Green = introduced here.  Red = measured limitation.</text>
<line x1="56" y1="92" x2="1224" y2="92" stroke="#2B2B2B" stroke-width="1"/>

<rect class="froz" x="56" y="108" width="15" height="15" rx="2"/><text class="meta" x="78" y="120">frozen, inherited</text>
<rect class="keep" x="212" y="108" width="15" height="15" rx="2"/><text class="meta" x="234" y="120">same role as base paper</text>
<rect class="new"  x="414" y="108" width="15" height="15" rx="2"/><text class="meta" x="436" y="120" style="fill:#1B7A4B;font-weight:600">new in this work</text>
<rect class="lim"  x="600" y="108" width="15" height="15" rx="2"/><text class="meta" x="622" y="120" style="fill:#A33A2C;font-weight:600">measured limitation</text>

<text class="sect" x="56" y="168">INPUT</text>
<rect class="keep" x="56" y="182" width="248" height="52" rx="4"/>
<text class="name" x="72" y="204">Source image</text><text class="meta" x="72" y="222">640 × 640 RGB</text>
<rect class="keep" x="330" y="182" width="248" height="52" rx="4"/>
<text class="name" x="346" y="204">Instruction</text><text class="meta" x="346" y="222">“put a hat on the dog”</text>

<text class="sect" x="56" y="282">FROZEN ENCODERS</text>
<rect class="froz" x="56" y="296" width="248" height="74" rx="4"/>
<text class="name" x="72" y="318">FastSAM · YOLOv8x-seg</text>
<text class="meta" x="72" y="336">71,751,811 params · frozen</text>
<text class="meta" x="72" y="352" style="fill:#9A9A9A">replaces their Qwen DiT (20.43 B)</text>
<path class="ln" d="M180 234 L 180 290"/>

<rect class="froz" x="330" y="296" width="248" height="74" rx="4"/>
<text class="name" x="346" y="318">CLIP text encoder</text>
<text class="meta" x="346" y="336">ViT-B/32 · 512-d · frozen</text>
<text class="meta" x="346" y="352" style="fill:#9A9A9A">replaces Qwen2.5-VL + Perceiver</text>
<path class="ln" d="M454 234 L 454 290"/>

<text class="sect" x="56" y="418">FEATURES</text>
<rect class="lim" x="56" y="432" width="248" height="86" rx="4"/>
<text class="tag" x="72" y="452" style="fill:#A33A2C">REPRESENTATIONAL CEILING</text>
<text class="name" x="72" y="474" style="fill:#A33A2C">32 prototypes · 160 × 160</text>
<text class="meta" x="72" y="492" style="fill:#A33A2C">Trained to segment OBJECTS, so they span</text>
<text class="meta" x="72" y="506" style="fill:#A33A2C">object regions far better than empty space.</text>
<path class="ln" d="M180 370 L 180 426"/>

<rect class="froz" x="330" y="432" width="118" height="54" rx="4"/>
<text class="name" x="344" y="454" style="font-size:12px">image context</text><text class="meta" x="344" y="472">SPPF pooled, 640-d</text>
<path class="ln" d="M250 370 L 300 370 L 300 450 L 324 450"/>
<rect class="froz" x="460" y="432" width="118" height="54" rx="4"/>
<text class="name" x="474" y="454" style="font-size:12px">text embedding</text><text class="meta" x="474" y="472">512-d</text>
<path class="ln" d="M454 370 L 454 400 L 519 400 L 519 426"/>

<text class="sect" x="56" y="566">TRAINABLE · 1,399,073 PARAMETERS</text>
<rect class="keep" x="56" y="580" width="248" height="78" rx="4"/>
<text class="name" x="72" y="602">FiLM modulation</text>
<text class="eq" x="72" y="624">v = γ(t) ⊙ v + β(t)</text>
<text class="meta" x="72" y="644">same mechanism as their MaskPredictor</text>
<path class="ln" d="M389 486 L 250 574"/>
<path class="ln" d="M519 486 L 280 574"/>

<rect class="new" x="330" y="580" width="248" height="78" rx="4"/>
<text class="tag" x="346" y="600" style="fill:#1B7A4B">NEW</text>
<text class="name" x="346" y="622" style="fill:#1B7A4B">Coefficient predictor</text>
<text class="eq" x="346" y="643" style="fill:#1B7A4B">MLP → c ∈ ℝ³², b ∈ ℝ</text>
<path class="lng" d="M304 620 L 324 620"/>

<text class="sect" x="640" y="418">MASK CONSTRUCTION</text>
<rect class="new" x="640" y="432" width="330" height="86" rx="4"/>
<text class="tag" x="658" y="452" style="fill:#1B7A4B">NEW</text>
<text class="name" x="658" y="474" style="fill:#1B7A4B">Prototype-basis synthesis</text>
<text class="eq" x="658" y="498" style="fill:#1B7A4B">mask = σ( Σᵢ cᵢ · protoᵢ + b )</text>
<text class="meta" x="658" y="512" style="fill:#1B7A4B">coefficients from text, not from a detection</text>
<path class="lng" d="M578 612 L 610 612 L 610 480 L 634 480"/>
<path class="lng" d="M304 466 L 634 466" stroke-dasharray="4 3"/>

<rect class="keep" x="640" y="556" width="330" height="50" rx="4"/>
<text class="name" x="658" y="578">Predicted edit region</text><text class="meta" x="658" y="596">160 × 160 logits, stride 4</text>
<path class="lng" d="M805 518 L 805 550"/>

<text class="sect" x="1000" y="168">SUPERVISION</text>
<rect class="keep" x="1000" y="182" width="224" height="52" rx="4"/>
<text class="name" x="1016" y="204">MagicBrush pairs</text><text class="meta" x="1016" y="222">real human source → target</text>
<rect class="new" x="1000" y="264" width="224" height="100" rx="4"/>
<text class="tag" x="1016" y="284" style="fill:#1B7A4B">NEW</text>
<text class="name" x="1016" y="306" style="fill:#1B7A4B">ΔE target extraction</text>
<text class="eq" x="1016" y="327" style="fill:#1B7A4B">CIE76 in L*a*b*</text>
<text class="meta" x="1016" y="346" style="fill:#1B7A4B">their human masks measured 9.1× too large</text>
<text class="meta" x="1016" y="359" style="fill:#1B7A4B">(precision 15.8%, IoU 0.16)</text>
<path class="lng" d="M1112 234 L 1112 258"/>
<rect class="keep" x="1000" y="556" width="224" height="50" rx="4"/>
<text class="name" x="1016" y="578">Loss</text><text class="eq" x="1016" y="597">BCE + 2·Dice</text>
<path class="lng" d="M1112 364 L 1112 550"/>
<path class="ln" d="M970 581 L 994 581"/>

<!-- ceiling panel -->
<line x1="56" y1="700" x2="1224" y2="700" stroke="#2B2B2B" stroke-width="1"/>
<text class="sect" x="56" y="728">THE CEILING WE MEASURED  ·  coefficients fitted directly to the ground-truth mask by least squares</text>
<text class="meta" x="56" y="748">The best IoU any coefficient predictor could reach with these 32 prototypes — no learning involved.</text>

<rect x="56" y="764" width="380" height="24" fill="#F4F4F4"/>
<text class="meta" x="66" y="781" style="font-weight:700">kind</text>
<text class="meta" x="190" y="781" style="font-weight:700">ceiling IoU</text>
<text class="meta" x="300" y="781" style="font-weight:700">our model</text>
<rect x="56" y="788" width="380" height="22" fill="#FFFFFF" stroke="#E4E4E4"/>
<text class="meta" x="66" y="803">remove</text><text class="meta" x="190" y="803">0.458</text><text class="meta" x="300" y="803">0.148</text>
<rect x="56" y="810" width="380" height="22" fill="#FFFFFF" stroke="#E4E4E4"/>
<text class="meta" x="66" y="825">modify</text><text class="meta" x="190" y="825">0.387</text><text class="meta" x="300" y="825">0.164</text>
<rect x="56" y="832" width="380" height="22" fill="#FDF0EF" stroke="#A33A2C"/>
<text class="meta" x="66" y="847" style="fill:#A33A2C;font-weight:700">insert</text>
<text class="meta" x="190" y="847" style="fill:#A33A2C;font-weight:700">0.211</text>
<text class="meta" x="300" y="847" style="fill:#A33A2C;font-weight:700">0.062</text>

<rect class="lim" x="470" y="764" width="754" height="90" rx="4"/>
<text class="name" x="488" y="788" style="fill:#A33A2C">The prototypes cannot represent insertion regions.</text>
<text class="meta" x="488" y="810" style="fill:#A33A2C">The insertion ceiling is less than half the removal ceiling, so no amount of data or training closes the gap — which is why</text>
<text class="meta" x="488" y="825" style="fill:#A33A2C">insert alone did not improve when the training set grew 5×, and why at matched n=497 it reaches 0.045 against modify's 0.157.</text>
<text class="meta" x="488" y="843" style="fill:#A33A2C">This refutes the justification originally given for this design: prototypes are NOT object-agnostic. FastSAM trained them on objects.</text>

<line x1="56" y1="880" x2="1224" y2="880" stroke="#2B2B2B" stroke-width="1"/>
<text class="sect" x="56" y="906">WHAT THIS MAKES THE CONTRIBUTION</text>
<text class="meta" x="56" y="928">Not "a better edit-region predictor". A measured, mechanistic explanation of why insertion is hard in prototype-based segmenters —</text>
<text class="meta" x="56" y="944">which plausibly extends to AdaptEdit, whose mask is also decoded from an object-trained backbone and whose stated limitation is insertion.</text>
<text class="meta" x="56" y="966" style="fill:#1B7A4B;font-weight:600">Next experiment: do k learned free-space prototypes raise the insert ceiling above 0.21?</text>
</svg>
